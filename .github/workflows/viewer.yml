name: Deploy viewer

on:
  push:
    branches: [main]
    paths:
      - 'pollster-viewer/**'
      - '.github/workflows/viewer.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pollster-viewer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pollster-viewer/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          # Optional repository variable; the build falls back to the default paste service.
          VITE_PASTE_URL: ${{ vars.VITE_PASTE_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pollster-viewer/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
