# Pollster messages, written in MiniMessage (https://docs.advntr.dev/minimessage/format.html).
#
# <prefix> inserts the "prefix" message into any other message. Placeholders such as <text>,
# <value> and <name> are filled in by the plugin; keep them where they are. Keys that are
# missing from this file are added back with their default text when the plugin loads.

prefix: '<gray>[<gold>Pollster</gold>]</gray> '

# Building blocks the dialog screens use. <text> is the words shown; <value> is the thing a
# label describes.
ui:
  style:
    title: '<gold><bold><text>'
    danger: '<red><bold><text>'
    primary: '<green><bold><text>'
    edit: '<yellow><bold><text>'
    secondary: '<gray><text>'
    label: '<aqua><text>: </aqua><gray><value>'
    error: '<red><text>'
  # Plain words used by the shared confirm, error and loading dialogs.
  button:
    confirm: 'Confirm'
    cancel: 'Cancel'
    ok: 'OK'
  title:
    error: 'Error'
  loading: 'Loading...'

errors:
  # Any stale dialog button: the survey was closed, reloaded or deleted, or the session ended.
  survey-unavailable: '<prefix><red>This survey is no longer available.'
  # A dialog button the player lacks the permission for.
  no-permission: '<red>You do not have permission to do that.'

report:
  player-only: '<prefix><red>Reports open as a dialog, so run this as a player. Use /pollster publish or /pollster export from the console.'
  unknown-survey: '<prefix><red>There is no survey with the id <id>.'

publish:
  success: '<prefix><green>Report published. Open it here: <link>'
  failed: '<prefix><red>Could not publish the report: <reason>'

export:
  success: '<prefix><green>Report exported to <path>'
  failed: '<prefix><red>Could not export the report: <reason>'

# Player-facing survey screens. <name>, <count>, <position>, <total>, <min>, <max> are filled in.
survey:
  list:
    empty: '<gray>There are no surveys available right now.'
    load-failed: '<red>The surveys could not be loaded. Try again in a moment.'
  intro:
    questions: '<aqua>Questions: <gray><count>'
    anonymous: '<gray>Your answers are anonymous.'
    named: '<gray>Your name is recorded with your answers.'
    rewards: '<green>Completing this survey gives rewards.'
  question:
    header: '<aqua>Question <white><position></white> of <white><total></white>'
  invalid:
    required: '<red>This question needs an answer.'
    too-few: '<red>Pick at least <min>.'
    too-many: '<red>Pick at most <max>.'
    too-long: '<red>That answer is too long. The limit is <max> characters.'
    generic: '<red>That answer could not be used. Try again.'
  review:
    intro: '<gray>Check your answers, then submit.'
    skipped: '(skipped)'
  thanks:
    body: '<green>Thank you for completing <white><name></white>.'
    preview: '<gray>This was a preview. Nothing was saved and no rewards were given.'
  preview-marker: ' <red><bold>[PREVIEW]'
  replace:
    title: 'Replace unfinished survey?'
    body: '<gray>You have an unfinished survey. Starting this one discards it.'
  already-responded: '<red>You have already completed this survey.'
  submit-failed: '<red>Your answers could not be saved. Please try again.'
  submit-cancelled: '<red>Your submission was cancelled.'
  cancelled: '<gray>Survey cancelled. Nothing was saved.'
  no-unfinished: '<prefix><gray>You have no unfinished survey.'
  saving: '<gray>Saving your answers...'
  # Words on the player survey screens. Buttons are plain text; the dialog style colours them.
  button:
    start: 'Start'
    not-now: 'Not now'
    close: 'Close'
    answer-yes: 'Yes'
    answer-no: 'No'
    next: 'Next'
    back: 'Back'
    skip: 'Skip'
    submit: 'Submit'
    cancel: 'Cancel'
  list-title: 'Surveys'
  list-state:
    completed: '<gray> - Completed'
    in-progress: '<yellow> - In progress'
    new: '<green> - New'
  text-answer-label: 'Your answer'

reminder:
  message: "<prefix><yellow>You have an unfinished survey. <click:run_command:'/surveys resume'><hover:show_text:'<gray>Continue your survey'><green><underlined>Click to continue</underlined></green></hover></click>"

# The in-game survey editor (/pollster). <args> is a comma separated list of question keys or
# similar; <reason> is the text of a problem; <count> and <file> are numbers and names.
editor:
  open-warning: '<yellow>Opening this survey locks its questions: text, type, options, order, limits and conditions can no longer change. To change them later, duplicate the survey.'
  locked: '<red>Questions cannot change once a survey has been opened. Duplicate the survey to edit them.'
  read-only: '<gray>This setting can no longer be changed because the survey is closed.'
  anonymous-locked: '<gray>Anonymous can only be changed while the survey is a draft.'
  move-breaks-condition: '<red>Cannot move: a condition would then use an answer that comes later (<args>).'
  key-referenced: '<red>Cannot rename: a condition of <args> uses this key.'
  remove-referenced: '<red>Cannot delete: a condition of <args> refers to this question.'
  duplicate-key: '<red>A question with the key <args> already exists.'
  unknown-question: '<red>There is no question with the key <args>.'
  save-failed: '<red>Could not save: <reason>'
  reload-ok: '<prefix><green>Reloaded <count> surveys.'
  reload-failure: '<prefix><red><file>: <reason>'
  reload-error: '<prefix><red>Reload failed: <reason>'
